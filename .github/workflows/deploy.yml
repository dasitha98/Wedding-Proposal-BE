
name: Wedding Proposal Backend

on:
  push:
    branches:
      - production
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.2.2
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SENDPULSE_CLIENT_ID: ${{ secrets.SENDPULSE_CLIENT_ID }}
          SENDPULSE_CLIENT_SECRET: ${{ secrets.SENDPULSE_CLIENT_SECRET }}
          SENDPULSE_FROM_EMAIL: ${{ secrets.SENDPULSE_FROM_EMAIL }}
          DO_SPACES_ACCESS_KEY: ${{ secrets.DO_SPACES_ACCESS_KEY }}
          DO_SPACES_SECRET_KEY: ${{ secrets.DO_SPACES_SECRET_KEY }}
          DO_SPACES_SERVICE_URL: ${{ secrets.DO_SPACES_SERVICE_URL }}
          DO_SPACES_BUCKET_NAME: ${{ secrets.DO_SPACES_BUCKET_NAME }}
          DO_SPACES_CDN_BASE_URL: ${{ secrets.DO_SPACES_CDN_BASE_URL }}
          APP_DIR: ${{ secrets.APP_DIR }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          envs: DB_CONNECTION_STRING,JWT_SIGNING_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,SENDPULSE_CLIENT_ID,SENDPULSE_CLIENT_SECRET,SENDPULSE_FROM_EMAIL,DO_SPACES_ACCESS_KEY,DO_SPACES_SECRET_KEY,DO_SPACES_SERVICE_URL,DO_SPACES_BUCKET_NAME,DO_SPACES_CDN_BASE_URL,APP_DIR,ADMIN_SEED_EMAIL,ADMIN_SEED_PASSWORD
          script: |
            set -e

            echo "Starting deployment..."

            echo "Writing application secrets..."
            ENV_DIR=/etc/wedding-proposal-api
            ENV_FILE=$ENV_DIR/production.env
            TMP_FILE=$(mktemp)
            chmod 600 "$TMP_FILE"

            # Appends KEY="value" in systemd EnvironmentFile format; skips empty secrets.
            add_env() {
              if [ -n "$2" ]; then
                escaped=$(printf '%s' "$2" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
                printf '%s="%s"\n' "$1" "$escaped" >> "$TMP_FILE"
              fi
            }

            add_env ASPNETCORE_ENVIRONMENT "Production"
            add_env ConnectionStrings__DefaultConnection "$DB_CONNECTION_STRING"
            add_env Jwt__SigningKey "$JWT_SIGNING_KEY"
            add_env Google__ClientId "$GOOGLE_CLIENT_ID"
            add_env Google__ClientSecret "$GOOGLE_CLIENT_SECRET"
            add_env SendPulse__ClientId "$SENDPULSE_CLIENT_ID"
            add_env SendPulse__ClientSecret "$SENDPULSE_CLIENT_SECRET"
            add_env SendPulse__FromEmail "$SENDPULSE_FROM_EMAIL"
            add_env DigitalOceanSpaces__AccessKey "$DO_SPACES_ACCESS_KEY"
            add_env DigitalOceanSpaces__SecretKey "$DO_SPACES_SECRET_KEY"
            add_env DigitalOceanSpaces__ServiceUrl "$DO_SPACES_SERVICE_URL"
            add_env DigitalOceanSpaces__BucketName "$DO_SPACES_BUCKET_NAME"
            add_env DigitalOceanSpaces__CdnBaseUrl "$DO_SPACES_CDN_BASE_URL"
            add_env AdminSeed__Email "$ADMIN_SEED_EMAIL"
            add_env AdminSeed__Password "$ADMIN_SEED_PASSWORD"

            sudo install -d -m 700 "$ENV_DIR"
            sudo install -m 600 "$TMP_FILE" "$ENV_FILE"
            rm -f "$TMP_FILE"

            : "${APP_DIR:?APP_DIR secret is not set}"
            cd "$APP_DIR"

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/production

            echo "Publishing application..."
            dotnet publish -c Release -o "$APP_DIR/publish"

            echo "Configuring API environment..."

            export ASPNETCORE_ENVIRONMENT="Production"
            export ASPNETCORE_URLS="http://127.0.0.1:5002"
            export ConnectionStrings__DefaultConnection="$DB_CONNECTION_STRING"
            export Jwt__SigningKey="$JWT_SIGNING_KEY"
            export Google__ClientId="$GOOGLE_CLIENT_ID"
            export Google__ClientSecret="$GOOGLE_CLIENT_SECRET"
            export SendPulse__ClientId="$SENDPULSE_CLIENT_ID"
            export SendPulse__ClientSecret="$SENDPULSE_CLIENT_SECRET"
            export SendPulse__FromEmail="$SENDPULSE_FROM_EMAIL"
            export DigitalOceanSpaces__AccessKey="$DO_SPACES_ACCESS_KEY"
            export DigitalOceanSpaces__SecretKey="$DO_SPACES_SECRET_KEY"
            export DigitalOceanSpaces__ServiceUrl="$DO_SPACES_SERVICE_URL"
            export DigitalOceanSpaces__BucketName="$DO_SPACES_BUCKET_NAME"
            export DigitalOceanSpaces__CdnBaseUrl="$DO_SPACES_CDN_BASE_URL"
            export AdminSeed__Email="$ADMIN_SEED_EMAIL"
            export AdminSeed__Password="$ADMIN_SEED_PASSWORD"

            echo "Starting API with PM2..."

            if pm2 describe wedding-proposal-api >/dev/null 2>&1; then
              pm2 restart wedding-proposal-api --update-env
            else
              pm2 start /usr/bin/dotnet \
                --name wedding-proposal-api \
                --interpreter none \
                -- Wedding-Proposal-BE.dll --urls http://127.0.0.1:5002
            fi

            pm2 save

            echo "Checking API status..."
            pm2 status wedding-proposal-api

            echo "Deployment completed successfully."
            